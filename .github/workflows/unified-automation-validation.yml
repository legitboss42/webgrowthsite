name: Unified automation validation

on:
  push:
    branches: [feature/unified-automation-dashboard]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-automation-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx tsx --test src/lib/webGrowthSession.test.ts src/lib/authSessionRoutes.test.ts src/lib/unifiedAuthorization.test.ts src/lib/dashboardRoutes.test.ts src/lib/unifiedSignIn.test.ts
      - run: npm run test:scheduler
