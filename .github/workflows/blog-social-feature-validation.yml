name: Blog social feature validation

on:
  push:
    branches: [feature/blog-social-automation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-social-feature-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run test:social
