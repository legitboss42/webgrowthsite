name: Generate social migration file

on:
  push:
    branches: [feature/blog-social-automation]
    paths: [.github/workflows/social-migration-name.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/blog-social-automation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate migration with Supabase CLI
        run: npx --yes supabase@latest migration new blog_social_automation
      - name: Commit generated empty migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/*_blog_social_automation.sql
          git commit -m "chore: generate blog social automation migration"
          git push origin HEAD:feature/blog-social-automation
