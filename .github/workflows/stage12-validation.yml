name: Stage 12 validation

on:
  push:
    branches: [stage12-app-redesign]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage12-app-redesign
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run test:whatsapp
      - run: npx tsc --noEmit
      - run: npx eslint src/app/admin/whatsapp src/components/whatsapp src/lib/whatsapp
      - run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
