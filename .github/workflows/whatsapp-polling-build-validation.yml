name: WhatsApp polling build validation

on:
  push:
    branches: [perf/whatsapp-supabase-polling]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run test:whatsapp
      - run: npx tsc --noEmit
      - run: npx eslint src/app/admin/whatsapp src/app/api/internal/whatsapp src/components/whatsapp src/lib/whatsapp
      - run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
