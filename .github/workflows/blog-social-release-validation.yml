name: Blog social release validation

on:
  push:
    branches: [feature/blog-social-automation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-social-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Social tests
        run: npm run test:social
      - name: Scheduler tests
        run: npm run test:scheduler
      - name: WhatsApp tests
        run: npm run test:whatsapp
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: SEO validation
        run: npm run seo:validate
      - name: Sitemap validation
        run: node scripts/validate-sitemap.mjs
      - name: Production build
        run: npm run build
      - name: Dual social render smoke test
        run: npm run social:render -- 01-why-we-rebuilt-not-redesigned
      - name: Verify rendered dimensions
        shell: bash
        run: |
          FFPROBE="$(node -e "console.log(require('ffprobe-static').path)")"
          for file in \
            out/social/01-why-we-rebuilt-not-redesigned/meta.mp4 \
            out/social/01-why-we-rebuilt-not-redesigned/tiktok.mp4; do
            test -s "$file"
            DIMENSIONS="$("$FFPROBE" -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$file")"
            test "$DIMENSIONS" = "1080x1920"
            echo "$file: $DIMENSIONS"
          done
      - name: Upload release render evidence
        uses: actions/upload-artifact@v4
        with:
          name: blog-social-release-render
          path: |
            out/social/01-why-we-rebuilt-not-redesigned/manifest.json
            out/social/01-why-we-rebuilt-not-redesigned/meta.mp4
            out/social/01-why-we-rebuilt-not-redesigned/tiktok.mp4
          retention-days: 1
