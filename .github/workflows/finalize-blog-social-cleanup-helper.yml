name: Finalize blog social cleanup helper

on:
  push:
    branches:
      - fix/finalize-blog-social-status-sync

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finalize-blog-social-status-sync
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Remove temporary article and governance entry
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const slug = 'temporary-social-automation-e2e-test-2';
          const governancePath = path.join('src', 'lib', 'route-governance.json');
          const governance = JSON.parse(fs.readFileSync(governancePath, 'utf8'));
          const before = governance.articles.length;
          governance.articles = governance.articles.filter((article) => article.slug !== slug);
          if (governance.articles.length !== before - 1) {
            throw new Error(`Expected exactly one governance entry for ${slug}`);
          }
          fs.writeFileSync(governancePath, `${JSON.stringify(governance, null, 2)}\n`);
          const articlePath = path.join('content', 'blog', `${slug}.md`);
          if (!fs.existsSync(articlePath)) throw new Error(`Missing ${articlePath}`);
          fs.unlinkSync(articlePath);

          const progressPath = path.join('docs', 'blog-social-e2e-test-2-progress-2026-09-07.md');
          const note = `\n## Final production result — 2026-09-08\n\n- Production commit: \`e7df60d8102632e68e4ec13bb0fbf6365f89edb3\`.\n- GitHub blog-social automation completed successfully.\n- Facebook publication reached \`PUBLISHED\`.\n- Instagram publication reached \`PUBLISHED\`.\n- TikTok scheduler post \`d51f902f-21d3-4789-bd4b-a2e849c3d443\` passed stored-video validation, was owner-approved, scheduled, submitted, and reached \`PUBLISHED\` on the first publish attempt.\n- TikTok publish id: \`v_pub_url~v2-1.7683037228876498964\`.\n- The original parent \`social_publications\` TikTok row remained \`NEEDS_APPROVAL\` after scheduler completion; PR #24 adds terminal scheduler-to-blog-social status synchronization to prevent that stale dashboard state.\n- The controlled temporary article and its route-governance entry are removed by this cleanup commit.\n`;
          fs.appendFileSync(progressPath, note);
          NODE

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/route-governance.json content/blog/temporary-social-automation-e2e-test-2.md docs/blog-social-e2e-test-2-progress-2026-09-07.md
          git commit -m "chore: remove completed blog-social test article"
          git push origin HEAD:fix/finalize-blog-social-status-sync
