name: Narrow Meta resolver repair

on:
  push:
    branches:
      - feature/blog-social-automation
    paths:
      - .github/workflows/narrow-meta-resolver-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/blog-social-automation
      - name: Narrow resolver to Page-settings connection
        run: echo '' | base64 -d | python3
      - name: Commit repair
        run: |
          git config user.name "Victorious"
          git config user.email "vickysaintbrown02@gmail.com"
          git add src/lib/socialAutomation/metaClient.ts docs/blog-social-meta-connection-bugfix-2026-09-07.md
          git diff --cached --check
          git commit -m "fix: narrow Meta resolver to Page-settings connection"
          git push origin HEAD:feature/blog-social-automation
