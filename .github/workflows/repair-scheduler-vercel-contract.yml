name: Repair scheduler Vercel contract

on:
  push:
    branches: [feature/blog-social-automation]
    paths:
      - .github/workflows/repair-scheduler-vercel-contract.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/blog-social-automation
      - name: Patch stale Vercel cron assertion
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/lib/scheduler/migration.test.ts')
          text = path.read_text()
          old = '  assert.equal(existsSync(vercelConfigPath), false, "Vercel cron config should not be committed");'
          new = '''  if (existsSync(vercelConfigPath)) {
            const vercelConfig = JSON.parse(readFileSync(vercelConfigPath, "utf8")) as { crons?: unknown };
            assert.equal(vercelConfig.crons, undefined, "Vercel cron config should not be committed");
          }'''
          if old not in text:
              raise SystemExit('expected stale assertion not found')
          path.write_text(text.replace(old, new, 1))
      - name: Verify scheduler tests
        run: |
          npm install --no-audit --no-fund
          npm run test:scheduler
      - name: Commit corrected contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/scheduler/migration.test.ts
          git commit -m "test: allow non-cron Vercel project config"
          git push origin HEAD:feature/blog-social-automation
