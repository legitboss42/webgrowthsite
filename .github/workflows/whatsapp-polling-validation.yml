name: WhatsApp polling validation

on:
  push:
    branches: [perf/whatsapp-supabase-polling]

permissions:
  contents: read

concurrency:
  group: whatsapp-polling-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run test:whatsapp
      - run: npx tsc --noEmit
      - run: npx eslint src/app/admin/whatsapp src/app/api/internal/whatsapp src/components/whatsapp src/lib/whatsapp
