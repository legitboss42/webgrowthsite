name: Repair route governance

on:
  push:
    branches: [feature/blog-social-automation]
    paths:
      - .github/workflows/repair-route-governance.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/blog-social-automation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Add private WhatsApp account route to governance
        shell: python
        run: |
          import json
          from pathlib import Path
          path = Path('src/lib/route-governance.json')
          data = json.loads(path.read_text())
          route = {
              'path': '/admin/whatsapp/account/',
              'status': 'NOINDEX',
              'sitemap': False,
              'reason': 'Internal WhatsApp account settings and lifecycle controls'
          }
          routes = data['routes']
          if not any(item.get('path') == route['path'] for item in routes):
              insert_at = next((i for i, item in enumerate(routes) if item.get('path') == '/admin/whatsapp/settings/'), len(routes))
              routes.insert(insert_at, route)
          path.write_text(json.dumps(data, indent=2) + '\n')
      - name: Verify SEO governance
        run: |
          npm ci --no-audit --no-fund
          npm run seo:validate
          node scripts/validate-sitemap.mjs
      - name: Commit governance fix
        shell: bash
        run: |
          if git diff --quiet -- src/lib/route-governance.json; then
            echo "route already governed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/route-governance.json
          git commit -m "fix: govern WhatsApp account route"
          git push origin HEAD:feature/blog-social-automation
