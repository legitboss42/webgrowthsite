name: Repair route governance

on:
  push:
    branches: [feature/blog-social-automation]
    paths:
      - .github/workflows/repair-route-governance.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/blog-social-automation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Classify every missing private physical route
        shell: python
        run: |
          import json
          from pathlib import Path

          governance_path = Path('src/lib/route-governance.json')
          data = json.loads(governance_path.read_text())
          routes = data['routes']
          known = {item.get('path') for item in routes}
          discovered = []
          public_missing = []
          private_prefixes = ('/api/', '/admin/', '/internal/', '/auth/', '/connect/')

          def app_file_to_route(file):
              relative = file.relative_to(Path('src/app')).as_posix()
              if relative in ('page.tsx', 'page.ts'):
                  return '/'
              is_page = relative.endswith('/page.tsx') or relative.endswith('/page.ts')
              for leaf in ('/page.tsx', '/page.ts', '/route.tsx', '/route.ts'):
                  if relative.endswith(leaf):
                      relative = relative[:-len(leaf)]
                      break
              route = '/' + relative.strip('/')
              return route + '/' if is_page else route

          files = []
          for pattern in ('page.tsx', 'page.ts', 'route.tsx', 'route.ts'):
              files.extend(Path('src/app').rglob(pattern))

          for file in sorted(set(files)):
              posix = file.as_posix()
              if '/sitemap-' in posix or posix.endswith('/llms.txt/route.ts'):
                  continue
              route = app_file_to_route(file)
              if route == '/blog/[slug]/':
                  continue
              alternate = route[:-1] if route.endswith('/') else route + '/'
              if route in known or alternate in known:
                  continue
              if route.startswith(private_prefixes):
                  discovered.append({
                      'path': route,
                      'status': 'NOINDEX',
                      'sitemap': False,
                      'reason': 'Private application or API route',
                  })
                  known.add(route)
              else:
                  public_missing.append(route)

          if public_missing:
              raise SystemExit('Unclassified public routes require review: ' + ', '.join(public_missing))

          if discovered:
              routes.extend(discovered)
              routes.sort(key=lambda item: item.get('path', ''))
              print('Added private governance for:', ', '.join(item['path'] for item in discovered))
          else:
              print('All physical routes are already governed')

          governance_path.write_text(json.dumps(data, indent=2) + '\n')
      - name: Verify SEO governance
        run: |
          npm ci --no-audit --no-fund
          npm run seo:validate
          node scripts/validate-sitemap.mjs
      - name: Commit governance fix
        shell: bash
        run: |
          if git diff --quiet -- src/lib/route-governance.json; then
            echo "routes already governed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/route-governance.json
          git commit -m "fix: complete private route governance"
          git push origin HEAD:feature/blog-social-automation
