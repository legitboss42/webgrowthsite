name: Repair route governance

on:
  push:
    branches: [feature/blog-social-automation]
    paths:
      - .github/workflows/repair-route-governance.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/blog-social-automation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Classify every physical WhatsApp admin page
        shell: python
        run: |
          import json
          from pathlib import Path

          governance_path = Path('src/lib/route-governance.json')
          data = json.loads(governance_path.read_text())
          routes = data['routes']
          known = {item.get('path') for item in routes}

          discovered = []
          root = Path('src/app/admin/whatsapp')
          for page in sorted(root.rglob('page.tsx')):
              relative = page.parent.relative_to(Path('src/app'))
              parts = list(relative.parts)
              route = '/' + '/'.join(parts) + '/'
              if route not in known:
                  discovered.append({
                      'path': route,
                      'status': 'NOINDEX',
                      'sitemap': False,
                      'reason': 'Internal WhatsApp application route'
                  })
                  known.add(route)

          if discovered:
              insert_at = next((i for i, item in enumerate(routes) if item.get('path') == '/connect/tiktok/'), len(routes))
              routes[insert_at:insert_at] = discovered
              print('Added private governance for:', ', '.join(item['path'] for item in discovered))
          else:
              print('All WhatsApp admin pages are already governed')

          governance_path.write_text(json.dumps(data, indent=2) + '\n')
      - name: Verify SEO governance
        run: |
          npm ci --no-audit --no-fund
          npm run seo:validate
          node scripts/validate-sitemap.mjs
      - name: Commit governance fix
        shell: bash
        run: |
          if git diff --quiet -- src/lib/route-governance.json; then
            echo "routes already governed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/route-governance.json
          git commit -m "fix: govern private WhatsApp application routes"
          git push origin HEAD:feature/blog-social-automation
